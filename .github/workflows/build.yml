# 双平台构建与测试（D3-8，铁律 16：客户端与单机包 Windows x64 优先，服务端 Windows 或 Linux
# x64 视情选择，**二者从第一天起都进 CI 构建**）。这条规矩自 2026-09-02 写下，
# 到 2026-09-18 之前一直欠着——C++ 侧只在开发机（macOS）上编过。
#
# **这里能证明什么**：两个目标平台上编得过、311 条 doctest 与 17 条 ctest 全过、
# 29 份黄金基准在三种编译器下给出同样的数。D3-8 的退出条件就是这些。
#
# **这里证明不了什么**（都要真机，属 P2 交付阶段）：
#   · 单机一体化包在干净 Windows 机上安装运行；
#   · 性能数字——构建机是共享虚拟机，实时因子之类不作数（D-015 / D-016）；
#   · 七套端到端用例——要浏览器、应用服务、145 GB 底图与建筑集，都不入 git；
#   · 建筑遮挡相关用例——`buildings.geojson` 15.9 MB 不入 git，相关用例**自己说跳过、不算通过**。

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新推一次就把上一次没跑完的取消掉：第一天就撞上了——
# js 那个 job 卡住不退，四轮各留一个跑不完的 job 在那儿占着。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 挂住就该当场红，不该占着构建机跑到默认的 6 小时上限
    timeout-minutes: 30
    strategy:
      # 一个平台红了，另一个也要跑完：两边各报各的错，一次看全
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64 / GCC
          - os: windows-latest
            label: Windows x64 / MSVC
    # Windows 上也用 bash：命令两个平台逐字相同，且 `set -e` 的语义一致
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 记下编译器与 CMake 版本（数字要能对上是哪一版编出来的）
        run: |
          cmake --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --system-information 2>/dev/null | grep -i -m 3 "CMAKE_CXX_COMPILER\b\|MSVC_VERSION" || true
          else
            c++ --version
          fi

      # geo 先建：它能独立构建是有意保留的性质（引擎 CMake 另外把它 add_subdirectory 挂上）
      - name: 构建 geo
        run: |
          cmake -S geo -B geo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build geo/build --config Release --parallel

      - name: geo 测试（坐标基座 210 例 + 遮挡黄金基准）
        run: ctest --test-dir geo/build -C Release --output-on-failure

      - name: 构建 engine
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build --config Release --parallel

      - name: engine 测试（doctest + cuav_run 冒烟）
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: 组件目录对黄金基准逐字节
        run: |
          RUN=engine/build/cuav_run
          [ -x "$RUN" ] || RUN=engine/build/Release/cuav_run.exe
          "$RUN" --catalog > /tmp/catalog.json
          diff -u tests/golden/component-catalog.json /tmp/catalog.json \
            && echo "组件目录与黄金基准逐字节相同"

      # ---- 以下只在 Windows：单机包要的引擎（W-2，D-099）--------------------------------
      # 静态链接运行库（/MT）由引擎 CMake 设；这里读导入表把它钉住——依赖了 VCRUNTIME140.dll 之类，
      # 干净机上双击就报「找不到 DLL」，而构建机上装着 VS，什么都看不出来。
      - name: 引擎不依赖 VC++ 运行库（导入表检查）
        if: runner.os == 'Windows'
        run: python deploy/pe_imports.py --forbid engine/build/Release/cuav_run.exe

      # 组包脚本 deploy/pack.py 只认这个产物：它读 cuav_run.build.json，提交与组包时的 HEAD 不同即拒。
      - name: 整理引擎产物与构建记录
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/engine
          cp engine/build/Release/cuav_run.exe dist/engine/
          CXXVER=$(grep -h -m 1 'set(CMAKE_CXX_COMPILER_VERSION' engine/build/CMakeFiles/*/CMakeCXXCompiler.cmake \
                   | sed 's/.*"\(.*\)".*/\1/')
          python - "$CXXVER" <<'PY'
          import hashlib, json, os, sys
          exe = "dist/engine/cuav_run.exe"
          rec = {
              "schema": "cuav-engine-build/1",
              "file": "cuav_run.exe",
              "sha256": hashlib.sha256(open(exe, "rb").read()).hexdigest(),
              "bytes": os.path.getsize(exe),
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "compiler": "MSVC " + sys.argv[1],
              "runtime_library": "MultiThreaded (/MT)",
          }
          text = json.dumps(rec, indent=2) + "\n"
          with open("dist/engine/cuav_run.build.json", "w", newline="\n") as f:   # Windows 上也写 LF
              f.write(text)
          print(text, end="")
          PY

      - name: 上传引擎产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cuav_run-win-x64
          path: dist/engine/
          if-no-files-found: error
          retention-days: 30

  js:
    name: 前端与应用服务 (Linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 交付基线的 Node LTS 版本仍是 OPEN（阶段 0 冻结，04 附录 B）。
      # 这里钉一个只是为了 CI 可复现，**不构成那项决策**。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 前端单测（含读仓库黄金基准的对拍）
        run: cd web && npm test

      - name: 构建应用服务
        run: |
          cd server
          npm ci
          npm run build

      # 服务端有一部分用例要真引擎（`CUAV_RUN`）。这个 job 不建 C++，
      # 那些用例会自己跳过——**跳过不是通过**，真引擎的集成由 cpp job 的 ctest 覆盖。
      #
      # 单独给 5 分钟：本地 4 秒跑完（119 过 8 跳，拿假引擎复现过 CI 的条件），
      # 而 CI 上它挂住不退。挂多久都是白挂，先让它红出来、把日志露出来（D3-8）。
      - name: 应用服务单测
        timeout-minutes: 5
        run: cd server && npm test

      - name: 路径可迁移检查（铁律 17）
        run: sh scripts/check-paths.sh

      - name: 文件名纯 ASCII 检查（铁律 15）
        run: sh scripts/check-ascii.sh
